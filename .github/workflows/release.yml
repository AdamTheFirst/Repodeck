name: Release
# Push a tag such as v1.0.0 and this builds Setup and publishes it on the Releases page.
# The newest Setup is then always at
#   https://github.com/<owner>/<repository>/releases/latest/download/RepodeckSetup.exe
#
# Code signing (SignPath) runs only when the repository variable SIGNPATH_ORGANIZATION_ID is set.
# It needs: variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG and the
# secret SIGNPATH_API_TOKEN. Each signing request is approved by hand in SignPath before it completes.
# The app is signed first, then Setup is built around the signed app and signed too.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm test
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1

      # ---- signing, step 1: the app
      - name: Upload the unsigned app
        if: env.SIGN == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/Repodeck.exe
      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/app
      - name: Build Setup around the signed app
        if: env.SIGN == 'true'
        shell: powershell
        run: ./scripts/build.ps1 -SignedApp signed/app/Repodeck.exe

      # ---- signing, step 2: Setup
      - name: Upload the unsigned Setup
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/RepodeckSetup-*.exe
      - name: Sign Setup
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/setup
      - name: Use the signed Setup
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signed = (Get-ChildItem signed/setup/RepodeckSetup-*.exe)[0]
          if ((Get-AuthenticodeSignature $signed.FullName).Status -ne 'Valid') { throw 'The signed Setup does not carry a valid signature.' }
          Copy-Item $signed.FullName dist/ -Force

      - name: Add a fixed file name and checksums
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/RepodeckSetup-*.exe)[0]
          Copy-Item $setup.FullName dist/RepodeckSetup.exe
          $lines = Get-ChildItem dist/RepodeckSetup*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content dist/SHA256SUMS.txt $lines
          Get-Content dist/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/RepodeckSetup*.exe).FullName dist/SHA256SUMS.txt --title "Repodeck ${{ github.ref_name }}" --generate-notes

      # The Microsoft Store package is uploaded to Partner Center by hand; the Store signs it.
      - name: Build the Microsoft Store package
        shell: powershell
        run: ./scripts/build-store.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist/store/*.msix
