name: Release
# Push a tag such as v1.0.0 and this builds Setup and publishes it on the Releases page.
# The newest Setup is then always at
#   https://github.com/<owner>/<repository>/releases/latest/download/repodeck-setup.exe
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm test
      - name: Build Setup
        shell: powershell
        run: ./scripts/build.ps1
      - name: Add a fixed file name and checksums
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/repodeck-setup-*.exe)[0]
          Copy-Item $setup.FullName dist/repodeck-setup.exe
          $lines = Get-ChildItem dist/repodeck-setup*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content dist/SHA256SUMS.txt $lines
          Get-Content dist/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/repodeck-setup*.exe).FullName dist/SHA256SUMS.txt --title "Repodeck ${{ github.ref_name }}" --generate-notes
